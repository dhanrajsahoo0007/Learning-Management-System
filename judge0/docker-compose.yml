version: '3.8'

services:
  server:
    image: judge0/judge0:1.13.0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ports:
      - "2358:2358"
    privileged: true
    security_opt:
      - seccomp:unconfined
    restart: always
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0
      - REDIS_PASSWORD=judge0
    depends_on:
      - db
      - redis

  workers:
    image: judge0/judge0:1.13.0
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    security_opt:
      - seccomp:unconfined
    restart: always
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0
      - REDIS_PASSWORD=judge0
    depends_on:
      - db
      - redis

  db:
    image: postgres:13.0
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0

  redis:
    image: redis:6.0
    command: [
      "bash", "-c",
      "docker-entrypoint.sh --appendonly yes --requirepass \"judge0\""
    ]
    volumes:
      - redis-data:/data
    restart: always

volumes:
  postgres-data:
  redis-data:
