<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
  <title id="title">Tinder high-level architecture</title>
  <desc id="desc">Clients talk to an API gateway. Gateway fans out to profile, location, recs, swipe/match, chat, and notify. Redis, Postgres, and Kafka sit below. Photos go to S3 plus CDN. Push uses APNs and FCM.</desc>
  <rect width="880" height="560" fill="#f8fafc"/>
  <rect x="300" y="20" width="280" height="44" rx="10" fill="#4f46e5"/>
  <text x="440" y="48" text-anchor="middle" fill="#fff" font-family="Inter, system-ui" font-size="14">Mobile clients</text>
  <line x1="440" y1="64" x2="440" y2="92" stroke="#64748b" stroke-width="2"/>
  <rect x="250" y="92" width="380" height="44" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="440" y="120" text-anchor="middle" fill="#1e1b4b" font-family="Inter, system-ui" font-size="14">API Gateway · auth · rate limits</text>
  <line x1="440" y1="136" x2="440" y2="168" stroke="#64748b" stroke-width="2"/>
  <g font-family="Inter, system-ui" font-size="12" fill="#1e1b4b">
    <rect x="20" y="168" width="130" height="48" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="85" y="197" text-anchor="middle">Profile</text>
    <rect x="160" y="168" width="130" height="48" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="225" y="197" text-anchor="middle">Location</text>
    <rect x="300" y="168" width="130" height="48" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="365" y="197" text-anchor="middle">Recs</text>
    <rect x="440" y="168" width="140" height="48" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="510" y="197" text-anchor="middle">Swipe / Match</text>
    <rect x="590" y="168" width="130" height="48" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="655" y="197" text-anchor="middle">Chat</text>
    <rect x="730" y="168" width="130" height="48" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="795" y="197" text-anchor="middle">Notify</text>
  </g>
  <line x1="440" y1="216" x2="440" y2="252" stroke="#64748b" stroke-width="2"/>
  <rect x="40" y="252" width="250" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="165" y="286" text-anchor="middle" font-family="Inter, system-ui" font-size="13" fill="#334155">Redis GEO · seen · last-active</text>
  <rect x="315" y="252" width="250" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="440" y="286" text-anchor="middle" font-family="Inter, system-ui" font-size="13" fill="#334155">Postgres</text>
  <rect x="590" y="252" width="250" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="715" y="286" text-anchor="middle" font-family="Inter, system-ui" font-size="13" fill="#334155">Kafka events</text>
  <line x1="440" y1="308" x2="440" y2="348" stroke="#64748b" stroke-width="2"/>
  <rect x="120" y="348" width="280" height="48" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="260" y="378" text-anchor="middle" font-family="Inter, system-ui" font-size="13" fill="#334155">Photos: S3 + CDN</text>
  <rect x="480" y="348" width="280" height="48" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="620" y="378" text-anchor="middle" font-family="Inter, system-ui" font-size="13" fill="#334155">Push: APNs / FCM</text>
  <text x="440" y="440" text-anchor="middle" font-family="Inter, system-ui" font-size="12" fill="#64748b">Swipe writes hit Postgres + Kafka. Recs read Redis. Chat is a small 1:1 service after a match.</text>
</svg>
